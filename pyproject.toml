[project]
name = "nupgis"
version = "0.1.1"
description = "A Python library for GIS using numpy only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.5",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
]
formatting = [
    "pre-commit>=4.2.0",
]


[tool.ruff]
line-length = 120

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']
